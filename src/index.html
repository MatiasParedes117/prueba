<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Universidad de Los Lagos</title>
    <link rel="stylesheet" href="./assets/css/style.css?v=2">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Utility Bar -->
    <div class="bg-[#002855] text-white text-xs py-2 hidden md:block">
        <div class="container mx-auto px-6 flex justify-end space-x-6">
            <a href="#" class="hover:text-ulagos-yellow transition-colors">Estudiantes</a>
            <a href="#" class="hover:text-ulagos-yellow transition-colors">Académicos</a>
            <a href="#" class="hover:text-ulagos-yellow transition-colors">Funcionarios</a>
            <a href="#" class="hover:text-ulagos-yellow transition-colors">Alumni</a>
            <a href="#" class="hover:text-ulagos-yellow transition-colors font-bold">Intranet</a>
        </div>
    </div>

    <!-- Main Header -->
    <header class="bg-ulagos-blue text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex flex-col lg:flex-row justify-between items-center">
            <!-- Logo Area -->
            <div class="logo flex-shrink-0 mb-4 lg:mb-0">
                <a href="#">
                    <img src="./assets/image/logo.png" alt="Universidad de Los Lagos" class="h-16 w-auto bg-white rounded-md p-1 shadow-sm">
                </a>
            </div>
            
            <!-- Navigation -->
            <nav class="w-full lg:w-auto">
                <ul class="flex flex-wrap justify-center lg:justify-end space-x-4 lg:space-x-8 text-sm lg:text-base font-semibold tracking-wide">
                    <li>
                        <a href="#" class="block py-2 hover:text-ulagos-yellow border-b-2 border-transparent hover:border-ulagos-yellow transition-all uppercase">Universidad</a>
                    </li>
                    <li>
                        <a href="#" class="block py-2 hover:text-ulagos-yellow border-b-2 border-transparent hover:border-ulagos-yellow transition-all uppercase">Admisión</a>
                    </li>
                    <li>
                        <a href="#" class="block py-2 hover:text-ulagos-yellow border-b-2 border-transparent hover:border-ulagos-yellow transition-all uppercase">Carreras</a>
                    </li>
                    <li>
                        <a href="#" class="block py-2 hover:text-ulagos-yellow border-b-2 border-transparent hover:border-ulagos-yellow transition-all uppercase">Investigación</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-ulagos-blue mb-4">Bienvenido al proyecto</h1>
        <p class="text-gray-700">Este es un proyecto inicializado con Tailwind CSS 4.* y Node.js.</p>
    </main>

    <script src="./assets/js/main.js"></script>
</body>
</html>
